; Runs the web server, the queue worker and the scheduler in a single Railway
; service.
;
; Railway starts exactly one process per service, and Nixpacks only ever runs
; the `web` command. Getting a worker and a scheduler any other way means
; creating two more services by hand in the dashboard and overriding their start
; commands — so a deploy that comes purely from merging into main would have
; neither, and every queued job would sit in the `jobs` table forever: no
; account credentials delivered, no grade notifications, and a CGPA that never
; moves after an approval.
;
; Keeping all three under one supervisor makes that setup automatic.
;
; The trade-off is that web, worker and scheduler share this container's CPU and
; memory, and scaling the web service scales the worker along with it. That is
; fine at pilot size. Before going wide, split them into their own Railway
; services (the Procfile still names the commands) and cut this file back to the
; web program alone.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Each command goes through `sh -c` so ${PORT} is expanded by the shell with a
; usable default. Supervisor's own %(ENV_PORT)s syntax fails to start the
; program outright when the variable is not set.

[program:web]
command=sh -c 'php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; --max-time recycles the worker hourly so a long-lived process cannot hold a
; stale container of the application in memory; supervisor restarts it.
; stopwaitsecs gives an in-flight job time to finish before SIGKILL.
[program:queue]
command=sh -c 'php artisan queue:work --tries=3 --max-time=3600 --sleep=3'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; schedule:work runs the scheduler in the foreground, firing schedule:run every
; minute. The tasks themselves are guarded with onOneServer() so more than one
; replica cannot run the same command twice.
[program:scheduler]
command=sh -c 'php artisan schedule:work'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
